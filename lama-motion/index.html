<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>LAMA · Bubble Tea</title>
<script src="assets/gsap.min.js"></script>
<style>
@font-face{font-family:Inter;src:url('assets/inter.woff2') format('woff2');font-weight:100 900}
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#F7F2E8}
#main{position:relative;width:1920px;height:1080px;overflow:hidden;color:#302B27;font-family:Inter,sans-serif;background:radial-gradient(ellipse at 73% 48%,#fffcf6 0%,#F7F2E8 65%)}
#logo{position:absolute;left:136px;top:55px;width:245px;height:165px;overflow:visible}
#title{position:absolute;left:140px;top:222px;font-size:24px;font-weight:500;letter-spacing:.18em;color:#8B8074}
#list{position:absolute;left:140px;top:305px;width:730px}
#highlight{position:absolute;left:-28px;top:0;width:738px;height:100px;background:#fffaf3;border:1px solid #E7DDD0;border-radius:26px;box-shadow:0 14px 40px #8063460d;opacity:0}
#highlight:before{content:'';position:absolute;left:16px;top:31px;height:38px;width:4px;border-radius:4px;background:#FF4D69}
.row{position:relative;display:flex;align-items:center;gap:28px;height:100px;margin-bottom:10px;white-space:nowrap;opacity:.46}
.number{width:38px;font-size:20px;font-variant-numeric:tabular-nums;opacity:.6}
.name{font-size:53px;line-height:1.12;font-weight:650;letter-spacing:-.045em}
#stage{position:absolute;left:1000px;top:130px;width:680px;height:790px}
#stage:before{content:'';position:absolute;left:-46px;top:48px;width:770px;height:700px;border-radius:50%;background:#EFE6D8}
.drink{position:absolute;left:62px;top:0;width:540px;height:790px;border-radius:48px;overflow:hidden;box-shadow:0 30px 70px #66544318;opacity:0;background:#f1f0ed}
.drink img{width:100%;height:100%;object-fit:cover;object-position:50% 50%;display:block}
.drink.studio img{transform:scale(1.95);transform-origin:49% 55%}
#mascot{position:absolute;right:77px;bottom:46px;width:180px;height:198px;object-fit:contain;transform-origin:50% 100%;mix-blend-mode:multiply;border-radius:24px}
#final{position:absolute;left:140px;bottom:110px;font-size:74px;font-weight:650;letter-spacing:-.05em;opacity:0}
#counter{position:absolute;left:144px;bottom:92px;font-size:18px;letter-spacing:.12em;color:#6D6258}
</style>
</head>
<body>
<main id="main" data-composition-id="main" data-start="0" data-duration="11.5" data-width="1920" data-height="1080" data-fps="30">
<svg id="logo" viewBox="350 1000 3850 2200" role="img" aria-label="LAMA"><image href="assets/logo.png" width="4500" height="4500"/></svg>
<div id="title">BUBBLE TEA</div>
<div id="list">
  <div id="highlight"></div>
  <div class="row"><span class="number">01</span><span class="name">OREO</span></div>
  <div class="row"><span class="number">02</span><span class="name">BANAN &amp; XURMO</span></div>
  <div class="row"><span class="number">03</span><span class="name">MARAKUYA</span></div>
  <div class="row"><span class="number">04</span><span class="name">MATCHA</span></div>
  <div class="row"><span class="number">05</span><span class="name">ANANAS</span></div>
</div>
<div id="stage">
  <div class="drink"><img src="assets/oreo.png" alt="OREO bubble tea"></div>
  <div class="drink studio"><img src="assets/banan-xurmo.jpg" alt="BANAN &amp; XURMO bubble tea"></div>
  <div class="drink studio"><img src="assets/marakuya.jpg" alt="MARAKUYA bubble tea"></div>
  <div class="drink studio"><img src="assets/matcha.jpg" alt="MATCHA bubble tea"></div>
  <div class="drink"><img src="assets/ananas.jpg" alt="ANANAS bubble tea"></div>
</div>
<img id="mascot" src="assets/mascot.jpg" alt="LAMA maskoti">
<div id="counter">01 / 05</div>
<div id="final">LAMA · Bubble Tea</div>
</main>
<script>
const tl=gsap.timeline({paused:true});
window.__timelines={main:tl};
const rows=[...document.querySelectorAll('.row')];
const drinks=[...document.querySelectorAll('.drink')];
tl.set({}, {}, 11.5);
tl.set(rows,{opacity:.46});
tl.set('#highlight',{opacity:0});
tl.from('#logo',{opacity:0,y:18,duration:.7,ease:'expo.out'},.1);
tl.from('#title',{opacity:0,y:12,duration:.6},.4);
tl.from('#list',{opacity:0,y:35,duration:.85,ease:'expo.out'},.65);
tl.from('#stage',{opacity:0,scale:.94,duration:.9,ease:'expo.out'},.8);
tl.from('#mascot',{opacity:0,y:100,rotation:-8,duration:1,ease:'back.out(1.4)'},1);
tl.from('#counter',{opacity:0,duration:.5},1.5);
for(let i=0;i<5;i++){
  const start=2+i*1.5;
  tl.to('#highlight',{opacity:1,y:i*110,duration:.45,ease:'expo.inOut'},start);
  tl.to(rows[i],{opacity:1,x:8,duration:.35},start);
  tl.fromTo(drinks[i],{opacity:0,y:45,scale:.94,rotation:3},{opacity:1,y:0,scale:1,rotation:0,duration:.55,ease:'back.out(1.15)'},start);
  tl.set('#counter',{textContent:String(i+1).padStart(2,'0')+' / 05'},start);
  if(i>0){
    tl.to(rows[i-1],{opacity:.46,x:0,duration:.3},start);
    tl.to(drinks[i-1],{opacity:0,y:-28,scale:.98,duration:.25},start);
  }
}
tl.to(['#list','#title','#counter'],{opacity:0,y:-20,duration:.45},9.6);
tl.to('#stage',{x:-60,scale:1.04,duration:.8,ease:'expo.inOut'},9.65);
tl.to('#mascot',{y:-14,rotation:5,duration:.32,yoyo:true,repeat:1,ease:'sine.inOut'},9.9);
tl.fromTo('#final',{opacity:0,y:25},{opacity:1,y:0,duration:.65,ease:'expo.out'},9.95);
</script>
</body>
</html>
